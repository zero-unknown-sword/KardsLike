<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>KardsLiker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">KardsLiker <span>mod editor</span></div>
    <nav class="zone-tabs">
      <button data-zone="workspace" class="active">工作区</button>
      <button data-zone="resources">资源区</button>
      <button data-zone="declarations">声明区</button>
    </nav>
    <div class="top-actions">
      <button id="sync-card">同步卡面</button>
      <button id="parse-card">解析 KL</button>
      <button id="save-card">保存声明</button>
      <div class="status" id="status">就绪</div>
    </div>
  </header>

  <main>
    <section id="zone-workspace" class="zone active">
      <div class="zone-head">
        <h2>工作区</h2>
        <nav class="workspace-tabs">
          <button data-workspace="card" class="active">卡牌</button>
          <button data-workspace="keyword">关键词</button>
        </nav>
      </div>

      <div id="workspace-card" class="workspace-panel active">
        <div class="workspace-split">
          <div class="face-pane">
            <div class="pane-label">卡面制作</div>
            <iframe id="forge-frame" title="KARDS DIY" src="/forge/"></iframe>
          </div>
          <div class="kl-pane">
            <div class="pane-label">KL 流程</div>
            <textarea id="kl-code" spellcheck="false">card "测试单位" {
    id: card_test_unit
    type: infantry
    country: soviet
    rarity: standard
    cost: 1
    operation_cost: 1
    at: 2
    df: 3
    text: "部署：抽 1 张牌。"
}</textarea>
          </div>
        </div>
      </div>

      <div id="workspace-keyword" class="workspace-panel">
        <div class="keyword-empty">
          <h3>关键词工作区</h3>
          <p>关键词编辑器骨架，后续接入 KL 关键词声明和触发流程。</p>
        </div>
      </div>
    </section>

    <section id="zone-resources" class="zone">
      <div class="zone-head">
        <h2>资源区</h2>
        <span id="resource-count">文件</span>
      </div>
      <div class="resource-body">
        <div class="resource-list">
          <input id="filter" placeholder="筛选文件..." autocomplete="off">
          <div id="files" class="file-list"></div>
        </div>
        <div class="resource-preview">
          <div class="pane-label">资源预览</div>
          <pre id="file-view">选择资源文件查看内容。</pre>
        </div>
      </div>
    </section>

    <section id="zone-declarations" class="zone">
      <div class="zone-head">
        <h2>声明区</h2>
        <span id="declaration-target">等待解析</span>
      </div>
      <div class="declaration-body">
        <div id="declaration-meta" class="declaration-meta">
          <div><b>名称</b><span>-</span></div>
          <div><b>ID</b><span>-</span></div>
          <div><b>国家 / 类型</b><span>-</span></div>
        </div>
        <pre id="card-code" class="declaration-code">在工作区编写 KL，然后点击“解析 KL”。</pre>
        <div class="declaration-actions">
          <button id="write-card">写入 mod</button>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
